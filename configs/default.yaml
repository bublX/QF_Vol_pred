# Значения по умолчанию для всех экспериментов.
# Файл эксперимента (configs/<name>.yaml) переопределяет только то, что отличается.
# Значения скопированы из scripts/*.py и аргументов по умолчанию в классах.
# Даты указывать в кавычках, иначе YAML прочитает их как date, а не str.

data:
  tickers: [ VTBR, SBER, LKOH, ROSN, NVTK, TATN, GAZP, GMKN, NLMK, MGNT ]
  start_year: 2014
  end_year: 2025
  archive_path: data/archives/1m_2014_2025/prices_1m_2014_2025.zip
  source_interval : 1
  interval: 10
  delay: 0
  base_url: https://iss.moex.com/iss/engines/stock/markets/shares/securities
  raw_dir: data/raw/1m_2014_2025/
  raw_file: prices_1m_2014_2025.csv

processing:
  min_day_coverage : 0.75
  min_bar_coverage : 0.0
  session_start: "10:00"
  session_end: "18:50"
  processed_dir: data/processed/10m_default_2014_2025/
  steps:
    - name: hampel
      params: 
        window_size: 5
        sigma: 3.0
        const: 1.4826
    - name: clip
      params:
        max_return: 5

features:
  feature_set: full  # full | har (только rv_1, rv_5, rv_22)
  num_lags: [ 1, 2, 5, 10 ]
  windows: [ 5, 22 ]
  ma_windows: [ 20, 50 ]
  vol_ratio_windows: [ 10, 15, 20 ]
  momentum_window: 20
  rsi_window: 14

split:
  train_end: '2021-12-31'
  valid_end: '2023-12-31'
  use_validation: true
  refit: true

model:
  name: null  # обязательно задать в файле эксперимента: har, rf, xgb, lgbm
  params: { }

evaluation:
  metrics: [ r2, rmse, mae, mse, qlike, mape ]

output:
  reports_dir: reports/tables
  name: null
