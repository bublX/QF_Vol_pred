model:
  name: har

features:
  feature_set: har

processing:
  processed_dir: data/processed/10m_2014_2025/
  steps:
  - name: hampel
    params:
      window_size: 10
      sigma: 3.0
      const: 1.4826
  - name: clip
    params:
      max_return: 5

split:
  train_end: '2023-12-31'
  valid_end: null
  use_validation: false

output:
  name: har_10m_2014_2025